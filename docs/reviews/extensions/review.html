<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans,system-ui);color:var(--foreground)}nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}button{border:1px solid var(--border);border-radius:var(--radius,6px);background:var(--secondary);color:var(--foreground);padding:7px 12px;font:inherit;font-size:12px;cursor:pointer}button[aria-selected="true"]{background:var(--accent);color:var(--accent-foreground);border-color:var(--ring)}figure{margin:0}img{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:var(--radius,6px)}figcaption{font-size:12px;line-height:1.5;color:var(--muted-foreground);margin:8px 0 0}figure[hidden]{display:none}
</style></head><body><nav aria-label="Native editor captures"><button aria-selected="true" onclick="show(0)">Zig + ZLS</button><button aria-selected="false" onclick="show(1)">Extension catalog</button><button aria-selected="false" onclick="show(2)">Python + Pyright</button><button aria-selected="false" onclick="show(3)">Light theme</button></nav>
<figure><img src="evidence/official-zls-completion.png" alt="Zig with real ZLS completion, wrapped source and Catppuccin icons"><figcaption>Official Zig grammar and ZLS. The source wraps without adding file line endings.</figcaption></figure>
<figure hidden><img src="evidence/extensions-catalog.png" alt="Native extension catalog with real official registry results and install state"><figcaption>Search results come from the official registry. Install/update actions use managed packages.</figcaption></figure>
<figure hidden><img src="evidence/python-pyright-completion.png" alt="Python source with real Pyright completions"><figcaption>Python Tree-sitter highlighting and a real Pyright server, installed through the common-language provider.</figcaption></figure>
<figure hidden><img src="evidence/python-light-theme.png" alt="Python using Catppuccin Latte theme and icons"><figcaption>Imported Catppuccin Latte colors and file icons in the native editor.</figcaption></figure>
<script>function show(index){document.querySelectorAll('figure').forEach((item,i)=>item.hidden=i!==index);document.querySelectorAll('button').forEach((item,i)=>item.setAttribute('aria-selected',String(i===index)))}</script></body></html>
