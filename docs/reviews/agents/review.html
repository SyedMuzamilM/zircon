<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans,system-ui);color:var(--foreground)}nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}button{background:var(--secondary);color:var(--foreground);border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;font:inherit;font-size:12px;cursor:pointer}button[aria-selected=true]{background:var(--accent);border-color:var(--ring);color:var(--accent-foreground)}figure{margin:0}figure[hidden]{display:none}img{display:block;max-width:100%;width:100%;height:auto;border:1px solid var(--border);border-radius:var(--radius)}figcaption{font-size:12px;color:var(--muted-foreground);line-height:1.5;margin-top:8px}.narrow img{max-width:700px}</style></head><body><nav aria-label="Native agent workspace captures"><button aria-selected="true" onclick="show(0)">Dark</button><button aria-selected="false" onclick="show(1)">Light</button><button aria-selected="false" onclick="show(2)">Models</button><button aria-selected="false" onclick="show(3)">Permission</button><button aria-selected="false" onclick="show(4)">Proxy</button><button aria-selected="false" onclick="show(5)">Narrow</button></nav><figure  class=""><img src="evidence/dark-conversation.png" alt="Dark native agent workspace"><figcaption>Native conversation with the deterministic test agent. Unicode streaming and approval-gated file editing are asserted.</figcaption></figure><figure hidden class=""><img src="evidence/light-conversation.png" alt="Light native agent workspace"><figcaption>The same native workflow with shared light theme colors.</figcaption></figure><figure hidden class=""><img src="evidence/model-picker.png" alt="Models native agent workspace"><figcaption>Filtered native model picker. Keyboard selection returns focus to the composer.</figcaption></figure><figure hidden class=""><img src="evidence/permission.png" alt="Permission native agent workspace"><figcaption>The test agent requests an edit. No file is written before Allow once.</figcaption></figure><figure hidden class=""><img src="evidence/proxy-connected.png" alt="Proxy native agent workspace"><figcaption>Real installed OpenCode ACP connection to your CLI proxy. Fifteen proxy model IDs loaded; no model prompt sent.</figcaption></figure><figure hidden class="narrow"><img src="evidence/narrow-conversation.png" alt="Narrow native agent workspace"><figcaption>A real 700 × 650 native window. The editor pane is omitted at this size.</figcaption></figure><script>function show(index){document.querySelectorAll('figure').forEach((el,i)=>el.hidden=i!==index);document.querySelectorAll('button').forEach((el,i)=>el.setAttribute('aria-selected',String(i===index)))}</script></body></html>
