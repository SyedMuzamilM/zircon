name: Framework
on: [push, pull_request]
jobs:
  headless:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: cargo build --release --locked --manifest-path tools/zed-extension-host/Cargo.toml
      - run: ./tools/zig build check
      - run: python3 -B tools/test_zig_stdlib_overlay.py
      - run: cargo test --release --locked --manifest-path tools/zed-extension-host/Cargo.toml
      - name: Verify Darwin child handle isolation
        if: runner.os == 'macOS'
        run: ./tools/zig run tools/verify_spawn_isolation.zig -lc
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Execute fresh native acceptance suites
        shell: bash
        run: |
          set -o pipefail
          ./tools/zig run tools/verify_spawn_isolation.zig -lc
          ./tools/zig build test-native-fresh --summary all 2>&1 | tee native-verification.log
      - name: Preserve native results and input routing modes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-verification
          path: |
            native-verification.log
            /tmp/zircon-native-input-mode.txt
            /tmp/zircon-native-queued-input-mode.txt
