[package]
name = "zircon-extension-host"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
serde_json = "1"
wasmtime = { version = "29.0.1", default-features = false, features = ["cranelift", "component-model", "runtime", "std"] }
wasmtime-wasi = { version = "29.0.1", default-features = false }
tree-sitter = { version = "0.25.10", features = ["wasm"] }
tree-sitter-highlight = "0.25.10"
resvg = { version = "0.45", default-features = false }
toml = "0.9"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-yaml = "0.7"
libc = "0.2"
